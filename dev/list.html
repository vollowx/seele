<!doctype html>
<html lang="en" dir="ltr" data-md-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>list</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400;0,17..18,700;1,17..18,400;1,17..18,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./shared.css" />
    <script type="module" src="./shared.ts"></script>
  </head>
  <body>
    <dev-configurator></dev-configurator>

    <h1>list</h1>

    <md-list style="width: 250px">
      <md-list-item>Item 1</md-list-item>
      <md-list-item>Item 2</md-list-item>
      <md-list-item selected>Item 3</md-list-item>
      <md-list-item disabled>Item 4</md-list-item>
    </md-list>

    <md-listbox id="listb1">
      <md-option value="blank" aria-label="blank"></md-option>
      <md-option value="apple">Apple</md-option>
      <md-option value="banana">Banana</md-option>
      <md-option value="cherry" selected>Cherry</md-option>
      <md-option value="peach" disabled>Peach</md-option>
      <md-option value="elderberry">Elderberry</md-option>
    </md-listbox>
  </body>
</html>
