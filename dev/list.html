<!doctype html>
<html lang="en" dir="ltr" data-md-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>list</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400;0,17..18,700;1,17..18,400;1,17..18,700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./shared.css" />
    <script type="module" src="./shared.ts"></script>
  </head>
  <body>
    <dev-configurator></dev-configurator>

    <h1>list</h1>

    <md-list style="--md-sys-spacing-density: -2">
      <md-list-item>
        Helium
        <md-icon slot="start" style="font-size: 32px;">wand_stars</md-icon>
      </md-list-item>
      <md-list-item>
        Updating Helium (23%)
        <span slot="supporting-text">Version 0.22.1.1 (Official build) (64-bit)</span>
        <md-circular-progress slot="start" indeterminate style="--md-circular-progress-size: 32px;"></md-circular-progress>
        <md-button slot="end" variant="outlined">Cancel</md-button>
      </md-list-item>
      <md-list-item>
        Copyright 2026 The Helium Authors. All rights reserved.
        <br />
        This is just a mimic of the Helium update process, the copyright notice is not real.
      </md-list-item>
    </md-list>

    <md-list-box id="listb1" style="width: 250px; --md-sys-spacing-density: -2">
      <md-option value="blank" aria-label="blank"></md-option>
      <md-option value="apple">Apple</md-option>
      <md-option value="banana">Banana</md-option>
      <md-option value="cherry" selected>Cherry</md-option>
      <md-option value="peach" disabled>Peach</md-option>
      <md-option value="elderberry">Elderberry</md-option>
    </md-list-box>
  </body>
</html>
