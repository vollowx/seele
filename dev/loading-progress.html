<!doctype html>
<html lang="en" dir="ltr" data-md-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>loading & progress</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400;0,17..18,700;1,17..18,400;1,17..18,700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./shared.css" />
    <script type="module" src="./shared.ts"></script>
  </head>
  <body>
    <dev-configurator></dev-configurator>

    <md-loading aria-label="Loading episodes" style="width: 100px"></md-loading>
    <md-loading aria-label="Loading episodes" contained></md-loading>

    <md-circular-progress indeterminate></md-circular-progress>
    <md-circular-progress id="notBar" value="50"></md-circular-progress>
    <br />

    <md-linear-progress
      value="50"
      style="width: 300px"
      id="bar"
    ></md-linear-progress>
    <br />
    <md-linear-progress
      value="50"
      style="width: 300px; --md-linear-progress-thickness: 8px"
      id="thickBar"
    ></md-linear-progress>
    <br />
    <md-linear-progress indeterminate style="width: 300px"></md-linear-progress>
    <br />
    <md-linear-progress
      indeterminate
      style="width: 300px; --md-linear-progress-thickness: 8px"
    ></md-linear-progress>

    <md-slider id="slider"></md-slider>

    <script>
      slider.addEventListener('input', (e) => {
        notBar.value = e.target.value;
        bar.value = e.target.value;
        thickBar.value = e.target.value;
      });
    </script>
  </body>
</html>
